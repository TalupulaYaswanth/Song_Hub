name: CI / Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint & Syntax Verification
        run: |
          python -m py_compile app.py models.py

      - name: Verify Flask App Initialization
        run: |
          python -c "import app, models; print('Application and database schema initialized successfully!')"

  maven-verify:
    name: Maven POM Lifecycle Verification
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies for Maven Exec
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Maven Lifecycle Verification
        run: mvn --batch-mode verify
